apiVersion: v1
kind: ConfigMap
metadata:
  name: jobs-web-config
data:
  MOCKS_URL: http://mocks:5001/jobs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobs-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jobs-web
  template:
    metadata:
      labels:
        app: jobs-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: web
          image: jobs-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: jobs-web-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: jobs-web
spec:
  selector:
    app: jobs-web
  ports:
    - name: http
      port: 80
      targetPort: http
